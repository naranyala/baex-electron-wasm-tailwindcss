<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baex · Browser API Extended</title>
    <style>
      *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
      body{background-color:#020917;margin:0;padding:0;overflow:hidden}
      #root{min-height:100vh}
      #preloader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(to bottom,#020917,#101725);transition:opacity .5s ease,visibility .5s ease}
      #preloader.fade-out{opacity:0;visibility:hidden}
      .loader-content{text-align:center}
      .loader-logo{font-size:4rem;font-weight:900;letter-spacing:-0.05em;background:linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.25rem;font-family:system-ui,-apple-system,sans-serif}
      .loader-sub{color:rgba(255,255,255,.3);font-size:.85rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase;margin-bottom:2.5rem;font-family:system-ui,-apple-system,sans-serif}
      .loader-track{width:200px;height:3px;background:rgba(255,255,255,.06);border-radius:4px;margin:0 auto 1.25rem;overflow:hidden}
      .loader-fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#60a5fa,#a78bfa);animation:load-bar 2.2s ease-in-out infinite}
      @keyframes load-bar{0%{width:0%;transform:translateX(0)}40%{width:60%;transform:translateX(0)}80%{width:80%;transform:translateX(30%)}100%{width:100%;transform:translateX(100%)}}
      .loader-text{color:rgba(255,255,255,.25);font-size:.8rem;font-family:ui-monospace,"SF Mono",monospace}
      .loader-dots{display:flex;justify-content:center;gap:6px;margin-bottom:2rem}
      .loader-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.08);animation:dot-pulse 1.4s ease-in-out infinite}
      .loader-dot:nth-child(2){animation-delay:.2s}
      .loader-dot:nth-child(3){animation-delay:.4s}
      @keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:.8;background:rgba(96,165,250,.5)}}
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="loader-content">
        <div class="loader-logo">BAEX</div>
        <div class="loader-sub">Browser API Extended</div>
        <div class="loader-dots">
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
        </div>
        <div class="loader-track"><div class="loader-fill"></div></div>
        <div class="loader-text" id="loader-text">Initializing WASM engine…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module">
      import { setupGlobalErrorHandling } from '/src/core/framework/error-handler.ts';
      setupGlobalErrorHandling();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
